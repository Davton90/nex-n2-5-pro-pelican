<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Bicycle Ride</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #bfe8ff;
  }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  .stage {
    width: min(100vw, 1200px);
    aspect-ratio: 12 / 7;
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  .sun-rays {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 18s linear infinite;
  }
  .cloud-one { animation: drift-one 22s linear infinite; }
  .cloud-two { animation: drift-two 28s linear infinite; }
  .cloud-three { animation: drift-one 34s linear infinite; }
  .ride {
    transform-box: fill-box;
    transform-origin: center;
    animation: ride-bob 1.2s ease-in-out infinite;
  }
  .wheel-rear {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.2s linear infinite;
  }
  .wheel-front {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.2s linear infinite;
  }
  .crank {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.2s linear infinite;
  }
  .pelican-body {
    transform-box: fill-box;
    transform-origin: 55% 55%;
    animation: pelican-bob 1.2s ease-in-out infinite;
  }
  .head {
    transform-box: fill-box;
    transform-origin: 25% 70%;
    animation: head-bob 1.2s ease-in-out infinite;
  }
  .wing {
    transform-box: fill-box;
    transform-origin: 82% 24%;
    animation: wing-flap 1.2s ease-in-out infinite;
  }
  .pouch {
    transform-box: fill-box;
    transform-origin: 12% 20%;
    animation: pouch-pulse 1.2s ease-in-out infinite;
  }
  .road-dashes { animation: road-scroll .75s linear infinite; }
  .tree-top {
    transform-box: fill-box;
    transform-origin: center;
    animation: tree-sway 3.6s ease-in-out infinite;
  }
  .tree-top.two { animation-delay: -1.2s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift-one {
    from { transform: translateX(-260px); }
    to { transform: translateX(1320px); }
  }
  @keyframes drift-two {
    from { transform: translateX(1320px); }
    to { transform: translateX(-300px); }
  }
  @keyframes ride-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  @keyframes pelican-bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-3px) rotate(-1deg); }
  }
  @keyframes head-bob {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    50% { transform: rotate(3deg) translateY(-3px); }
  }
  @keyframes wing-flap {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-8deg); }
  }
  @keyframes pouch-pulse {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(1.04); }
  }
  @keyframes road-scroll {
    to { transform: translateX(-120px); }
  }
  @keyframes tree-sway {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
  }
</style>
</head>
