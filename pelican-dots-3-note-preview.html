<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pelican on a Bicycle</title>
<style>
  html,body{margin:0;height:100%;background:#2b3a67;font-family:system-ui,sans-serif}
  .stage{display:flex;align-items:center;justify-content:center;height:100%}
  svg{width:900px;height:520px;max-width:96vw}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5d8fd3"/><stop offset="1" stop-color="#a9c6ec"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6f7a3a"/><stop offset="1" stop-color="#404a22"/>
  </linearGradient>
</defs>
<rect width="900" height="520" fill="url(#sky)"/>
<rect y="360" width="900" height="160" fill="url(#ground)"/>
<g id="clouds">
  <ellipse cx="120" cy="90" rx="40" ry="16" fill="#ffffff" opacity="0.85">
    <animate attributeName="cx" from="-60" to="960" dur="40s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="160" cy="90" rx="28" ry="12" fill="#ffffff" opacity="0.85">
    <animate attributeName="cx" from="-60" to="960" dur="40s" repeatCount="indefinite"/>
  </ellipse>
</g>
<g id="bike">
  <g id="bike-group">
    <animateTransform attributeName="transform" type="translate" from="-120 0" to="1020 0" dur="8s" repeatCount="indefinite"/>


    <!-- wheels -->
    <g id="wheel-back">
      <circle cx="250" cy="360" r="42" fill="none" stroke="#222" stroke-width="6"/>
      <circle cx="250" cy="360" r="6" fill="#222"/>
      <line x1="250" y1="360" x2="292" y2="318" stroke="#222" stroke-width="4"/>
      <line x1="250" y1="360" x2="208" y2="318" stroke="#222" stroke-width="4"/>
      <line x1="250" y1="360" x2="250" y2="318" stroke="#222" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" from="0 250 360" to="360 250 360" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <g id="wheel-front">
      <circle cx="560" cy="360" r="42" fill="none" stroke="#222" stroke-width="6"/>
      <circle cx="560" cy="360" r="6" fill="#222"/>
      <line x1="560" y1="360" x2="602" y2="318" stroke="#222" stroke-width="4"/>
      <line x1="560" y1="360" x2="518" y2="318" stroke="#222" stroke-width="4"/>
      <line x1="560" y1="360" x2="560" y2="318" stroke="#222" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" from="0 560 360" to="360 560 360" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <!-- frame -->
    <path d="M250 360 L300 300 L470 300 L560 360" fill="none" stroke="#c0392b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="300" y1="300" x2="300" y2="250" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
    <line x1="470" y1="300" x2="520" y2="250" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
    <line x1="300" y1="250" x2="520" y2="250" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
    <!-- handlebar -->
    <line x1="520" y1="250" x2="545" y2="228" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <line x1="520" y1="250" x2="545" y2="272" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <!-- seat -->
    <ellipse cx="380" cy="250" rx="34" ry="9" fill="#333"/>
    <line x1="380" y1="250" x2="380" y2="285" stroke="#333" stroke-width="6"/>
    <!-- pedals / chainring -->
    <g id="crank">
      <circle cx="250" cy="360" r="18" fill="none" stroke="#555" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" from="0 250 360" to="360 250 360" dur="1.6s" repeatCount="indefinite"/>
      <line x1="250" y1="360" x2="250" y2="388" stroke="#222" stroke-width="6" stroke-linecap="round"/>
    </g>


    <!-- PELICAN sitting on seat at 380,250 -->
    <g id="pelican">
      <!-- bob with pedaling -->
      <animateTransform attributeName="transform" type="translate" values="0 -4; 0 4; 0 -4; 0 0; 0 -4" keyTimes="0;0.25;0.5;0.75;1" dur="1.6s" repeatCount="indefinite"/>
      <!-- body -->
      <ellipse cx="380" cy="232" rx="46" ry="34" fill="#f4f1ea" stroke="#333" stroke-width="3"/>
      <!-- belly shading -->
      <ellipse cx="380" cy="240" rx="30" ry="22" fill="#ebe3d0"/>
      <!-- wing flapping -->
      <g id="wing">
        <path d="M350 228 q-30 -40 -10 -60 q20 -18 40 0 q10 14 -6 34 q-18 16 -24 -4 z" fill="#e8e0cf" stroke="#333" stroke-width="3"/>
        <animateTransform attributeName="transform" type="rotate" values="-18 350 228; 30 350 228; -18 350 228" keyTimes="0;0.5;1" dur="0.8s" repeatCount="indefinite"/>
      </g>
      <!-- neck -->
      <path d="M398 218 q18 -40 34 -52" fill="none" stroke="#f4f1ea" stroke-width="14" stroke-linecap="round"/>
      <path d="M398 218 q18 -40 34 -52" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="434" cy="162" r="22" fill="#f4f1ea" stroke="#333" stroke-width="3"/>
      <!-- beak -->
      <path d="M450 162 l44 -4 l-6 8 l-44 -2 z" fill="#f39c12" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
      <!-- lower beak -->
      <path d="M450 162 l44 6 l-6 -8 l-44 2 z" fill="#e08810" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
      <!-- pouch -->
      <path d="M452 162 q14 22 30 2 q-6 14 -18 12 q-14 -2 -12 -14 z" fill="#e67e22" stroke="#333" stroke-width="2"/>
      <!-- eye -->
      <circle cx="444" cy="156" r="4" fill="#222"/>
      <circle cx="445.5" cy="154.5" r="1.2" fill="#fff"/>
      <!-- legs pedaling -->
      <g id="leg-left">
        <line x1="372" y1="250" x2="360" y2="280" stroke="#f39c12" stroke-width="5" stroke-linecap="round"/>
        <line x1="360" y1="280" x2="348" y2="300" stroke="#f39c12" stroke-width="5" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="0 372 250; 20 372 250; 0 372 250" keyTimes="0;0.5;1" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <g id="leg-right">
        <line x1="388" y1="250" x2="400" y2="280" stroke="#f39c12" stroke-width="5" stroke-linecap="round"/>
        <line x1="400" y1="280" x2="412" y2="300" stroke="#f39c12" stroke-width="5" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="20 388 250; 0 388 250; 20 388 250" keyTimes="0;0.5;1" dur="1.6s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</g>
</svg>
</div>
</body>
</html>
