<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelican Bicycle Ride</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f4e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.7), transparent 28%),
        linear-gradient(180deg, #bfe9f5 0%, #f8f1da 62%, #d4e5b6 100%);
    }

    .scene {
      width: min(100vw, 1400px);
      min-height: min(100vh, 900px);
      padding: clamp(14px, 3vw, 48px);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 520px;
      border-radius: 30px;
      box-shadow: 0 28px 70px rgba(45, 83, 92, 0.18);
      overflow: visible;
    }

    .sun-rays {
      transform-origin: 990px 150px;
      animation: sun-spin 28s linear infinite;
    }

    .cloud-a {
      animation: cloud-drift-a 18s ease-in-out infinite alternate;
    }

    .cloud-b {
      animation: cloud-drift-b 23s ease-in-out infinite alternate;
    }

    .cloud-c {
      animation: cloud-drift-c 27s ease-in-out infinite alternate;
    }

    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin 1.15s linear infinite;
    }

    .wheel-back {
      animation-duration: 1.15s;
    }

    .spokes {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin 1.15s linear infinite;
    }

    .crankset {
      transform-box: fill-box;
      transform-origin: center;
      animation: crank-spin 1.15s linear infinite;
    }

    .crank-arm {
      transform-box: fill-box;
      transform-origin: 42px 42px;
      transform-origin: 42% 42%;
      animation: crank-arm-spin 1.15s linear infinite;
    }

    .pedal-arm {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: pedal-arm-spin 1.15s linear infinite;
    }

    .leg-front,
    .leg-rear {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: pedaling 1.15s ease-in-out infinite alternate;
    }

    .leg-rear {
      animation-delay: -0.575s;
    }

    .pelican-bob {
      animation: pelican-bob 0.575s ease-in-out infinite alternate;
    }

    .head {
      transform-box: fill-box;
      transform-origin: 18% 88%;
      animation: head-nod 0.575s ease-in-out infinite alternate;
    }

    .beak {
      transform-box: fill-box;
      transform-origin: 0% 35%;
      animation: beak-flap 0.575s ease-in-out infinite alternate;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 88% 18%;
      animation: wing-flap 0.575s ease-in-out infinite alternate;
    }

    .tail {
      transform-box: fill-box;
      transform-origin: 90% 35%;
      animation: tail-wag 0.575s ease-in-out infinite alternate;
    }

    .scarf {
      transform-box: fill-box;
      transform-origin: 8% 85%;
      animation: scarf-wave 0.9s ease-in-out infinite alternate;
    }

    .road-line {
      animation: road-line 0.5s linear infinite;
    }

    .grass-line {
      animation: grass-line 0.5s linear infinite;
    }

    .motion-line {
      animation: motion-line 0.7s ease-out infinite;
    }

    .motion-line:nth-child(2) {
      animation-delay: -0.23s;
    }

    .motion-line:nth-child(3) {
      animation-delay: -0.46s;
    }

    @keyframes sun-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes cloud-drift-a {
      from { transform: translateX(-18px); }
      to { transform: translateX(34px); }
    }

    @keyframes cloud-drift-b {
      from { transform: translateX(24px); }
      to { transform: translateX(-38px); }
    }

    @keyframes cloud-drift-c {
      from { transform: translateX(-28px); }
      to { transform: translateX(22px); }
    }

    @keyframes wheel-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes crank-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    @keyframes crank-arm-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    @keyframes pedal-arm-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pedaling {
      from { transform: rotate(-14deg); }
      to { transform: rotate(16deg); }
    }

    @keyframes pelican-bob {
      from { transform: translateY(0); }
      to { transform: translateY(-7px); }
    }

    @keyframes head-nod {
      from { transform: rotate(-3deg); }
      to { transform: rotate(4deg); }
    }

    @keyframes beak-flap {
      from { transform: rotate(0deg); }
      to { transform: rotate(9deg); }
    }

    @keyframes wing-flap {
      from { transform: rotate(-4deg) translateY(0); }
      to { transform: rotate(7deg) translateY(5px); }
    }

    @keyframes tail-wag {
      from { transform: rotate(-3deg); }
      to { transform: rotate(7deg); }
    }

    @keyframes scarf-wave {
      from { transform: rotate(-4deg) skewY(2deg); }
      to { transform: rotate(7deg) skewY(-5deg); }
    }

    @keyframes road-line {
      from { transform: translateX(0); }
      to { transform: translateX(-180px); }
    }

    @keyframes grass-line {
      from { transform: translateX(0); }
      to { transform: translateX(-120px); }
    }

    @keyframes motion-line {
      from { opacity: 0.75; transform: translateX(24px); }
      to { opacity: 0; transform: translateX(-42px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-labelledby="scene-title">
    <h1 id="scene-title" class="sr-only">Animated pelican riding a bicycle</h1>

</html>
